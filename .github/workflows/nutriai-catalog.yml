name: NutriAI food catalog

# Descarga USDA SR Legacy y regenera el catálogo de alimentos de la app.
on:
  workflow_dispatch:
  push:
    paths:
      - 'nutriai/tools/catalog/**'
      - '.github/workflows/nutriai-catalog.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build catalog
        run: |
          mkdir -p nutriai/app/src/main/assets/catalog
          python3 nutriai/tools/catalog/build_catalog.py nutriai/app/src/main/assets/catalog/foods.json | tee catalog.log

      - uses: actions/upload-artifact@v4
        with:
          name: nutriai-catalog
          path: |
            nutriai/app/src/main/assets/catalog/foods.json
            catalog.log

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nutriai/app/src/main/assets/catalog/foods.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "chore(nutriai): regenerate food catalog from USDA SR Legacy"
          git push
