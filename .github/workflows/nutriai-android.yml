name: NutriAI Android

on:
  push:
    paths:
      - 'nutriai/**'
      - '.github/workflows/nutriai-android.yml'
  pull_request:
    paths:
      - 'nutriai/**'
      - '.github/workflows/nutriai-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nutriai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nutriai
    env:
      # URL del backend de IA (variable del repositorio). Vacía = modo demostración.
      NUTRIAI_AI_BACKEND_URL: ${{ vars.NUTRIAI_AI_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew :domain:test :app:testDebugUnitTest 2>&1 | tee build.log

      - name: Print compile errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|> Task .*FAILED" build.log | head -80 || true

      - name: Print test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as E
          for f in glob.glob('**/build/test-results/**/TEST-*.xml', recursive=True):
              r = E.parse(f).getroot()
              for tc in r.findall('testcase'):
                  for x in tc.findall('failure') + tc.findall('error'):
                      print('FAILED', r.get('name'), '::', tc.get('name'))
                      print('\n'.join((x.text or '').splitlines()[:12]))
                      print('-----')
          PY

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Commit Room schema
        if: github.event_name == 'push'
        run: |
          git add app/schemas
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(nutriai): update exported Room schema"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Publish test release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk NutriAI.apk
          TAG=nutriai-latest
          NOTES="APK de prueba generado automáticamente desde ${GITHUB_SHA::7}. Firmado con clave de prueba: sirve para instalar y probar, no para publicar en Google Play."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" NutriAI.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" NutriAI.apk --prerelease --title "NutriAI (versión de prueba)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nutriai-reports
          path: |
            nutriai/**/build/reports/
            nutriai/**/build/test-results/
            nutriai/app/schemas/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: nutriai-apk
          path: nutriai/app/build/outputs/apk/**/*.apk
