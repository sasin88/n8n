name: NutriAI Android

on:
  push:
    paths:
      - 'nutriai/**'
      - '.github/workflows/nutriai-android.yml'
  pull_request:
    paths:
      - 'nutriai/**'
      - '.github/workflows/nutriai-android.yml'
  workflow_dispatch:

concurrency:
  group: nutriai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nutriai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :domain:test :app:testDebugUnitTest --stacktrace

      - name: Print test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as E
          for f in glob.glob('**/build/test-results/**/TEST-*.xml', recursive=True):
              r = E.parse(f).getroot()
              for tc in r.findall('testcase'):
                  for x in tc.findall('failure') + tc.findall('error'):
                      print('FAILED', r.get('name'), '::', tc.get('name'))
                      print('\n'.join((x.text or '').splitlines()[:12]))
                      print('-----')
          PY

      - name: Print Room schema
        if: always()
        run: find app/schemas -name '*.json' -exec sh -c 'echo "SCHEMA_FILE $1"; cat "$1"' _ {} \;

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nutriai-reports
          path: |
            nutriai/**/build/reports/
            nutriai/**/build/test-results/
            nutriai/app/schemas/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: nutriai-debug-apk
          path: nutriai/app/build/outputs/apk/debug/*.apk
